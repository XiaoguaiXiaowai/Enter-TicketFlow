name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:env
      - run: pnpm test
      - name: 依赖漏洞审计（生产依赖，高危及以上）
        run: pnpm audit --audit-level high --prod
      - run: pnpm --filter @ticket/api check:permissions
      - run: pnpm build

  integration:
    needs: static
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ticket_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ticket_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      POSTGRES_DB: ticket_ci
      POSTGRES_SUPERUSER: postgres
      POSTGRES_SUPERUSER_PASSWORD: postgres
      DATABASE_URL: postgresql://app_rw:ci_rw@localhost:5432/ticket_ci?schema=public
      MIGRATE_DATABASE_URL: postgresql://app_migrator:ci_migrator@localhost:5432/ticket_ci?schema=public
      WORKER_DATABASE_URL: postgresql://app_worker:ci_worker@localhost:5432/ticket_ci?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_jwt_secret_0123456789abcdef0123456789abcdef
      SEED_DEFAULT_PASSWORD: ci_seed_password
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 建角色并执行迁移
        run: pnpm --filter @ticket/api db:prepare
      - name: 重复执行迁移（幂等）
        run: pnpm --filter @ticket/api db:prepare
      - name: 校验 schema 与迁移一致
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres ticket_shadow
          pnpm --filter @ticket/api exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://postgres:postgres@localhost:5432/ticket_shadow \
            --exit-code
      - name: 写入演示租户数据
        run: pnpm --filter @ticket/api db:seed
      - run: pnpm test:integration
      - name: 校验 RLS 覆盖
        run: pnpm --filter @ticket/api check:rls

  e2e:
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: 启动编排环境
        run: |
          cp .env.example .env
          docker compose --profile tools build
          docker compose --profile tools run --rm migrate
          docker compose --profile tools run --rm seed
          docker compose up -d
      - name: 等待就绪检查通过
        run: |
          for attempt in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/health/ready || true)
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "ready check did not pass in time"
          docker compose ps
          exit 1
      - name: 容器状态
        run: docker compose ps
      - run: pnpm exec playwright test
      - name: 上传失败产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: 输出容器日志
        if: failure()
        run: docker compose logs --no-color
